plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.developer'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(23)
	}
}

repositories {
	mavenCentral()
	maven { url = 'https://repo.spring.io/snapshot' }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'com.opencsv:opencsv:5.10'
	implementation 'org.apache.commons:commons-csv:1.11.0'
	implementation 'com.jgoodies:jgoodies-forms:1.9.0'
    implementation 'com.jgoodies:jgoodies-looks:2.7.0'
    implementation 'com.jgoodies:jgoodies-common:1.8.1'
    implementation 'org.apache.commons:commons-configuration2:2.11.0'
    implementation 'commons-beanutils:commons-beanutils:1.9.4'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

bootJar {
	destinationDirectory = file("${projectDir}/deploy")
    archiveBaseName = 'password-manager-app'
    archiveVersion = '1.0.0'
    // mainClass = 'com.example.demo.DemoApplication' // Uncomment if you have multiple main classes
}

// Optional: Disable the extra *-plain.jar file generation
jar {
    enabled = false
}

tasks.register('copyDependencies', Copy) {
    from configurations.runtimeClasspath
    into "${buildDir}/libs/dependencies"
}
